<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akash &amp; Vanshika — End-Term &amp; Placement War Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6eaef; --panel:#ffffff; --panel2:#f5f7fa;
  --ink:#141d2b; --muted:#5c6a7d; --line:#d3dae3; --line2:#e6ebf1;
  --joint:#20418f; --akash:#0c6b5c; --vanshika:#8b2f62; --exam:#a81f1b; --done:#2c7a4b;
  --shadow:0 1px 0 rgba(20,29,43,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --panel:#1a2230; --panel2:#202a3a;
    --ink:#e7ecf3; --muted:#9aa8bb; --line:#2f3b4d; --line2:#27313f;
    --joint:#7d9ce8; --akash:#4dbfa8; --vanshika:#e084b4; --exam:#ff7a72; --done:#5fc98a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121722; --panel:#1a2230; --panel2:#202a3a;
  --ink:#e7ecf3; --muted:#9aa8bb; --line:#2f3b4d; --line2:#27313f;
  --joint:#7d9ce8; --akash:#4dbfa8; --vanshika:#e084b4; --exam:#ff7a72; --done:#5fc98a;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4,.ui{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px 80px}

header.top{
  position:sticky;top:0;z-index:30;background:var(--panel);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1040px;margin:0 auto;padding:12px 14px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.brand{font-family:Archivo;font-weight:700;font-size:19px;letter-spacing:-.02em;margin:0}
.brand span{color:var(--muted);font-weight:500}
.headmeta{font-size:13px;color:var(--muted);margin-left:auto;display:flex;gap:12px;align-items:center}
button.mini{
  font-family:Archivo;font-size:12px;font-weight:600;color:var(--ink);
  background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;cursor:pointer}
button.mini:hover{border-color:var(--ink)}
.bar{height:5px;background:var(--line2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--joint);width:0%;transition:width .35s ease}
.topbar{max-width:1040px;margin:8px auto 0;padding:0 14px 10px}
.topbar .lab{display:flex;justify-content:space-between;font-family:Archivo;font-size:12px;color:var(--muted);margin-bottom:5px}

nav.tabs{max-width:1040px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  font-family:Archivo;font-size:13px;font-weight:600;white-space:nowrap;
  background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
  padding:9px 10px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--joint)}

/* day rail */
.rail{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:thin}
.chip{
  flex:0 0 auto;width:92px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);cursor:pointer;text-align:left;font-family:Archivo;box-shadow:var(--shadow)}
.chip b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.chip small{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.chip .ex{font-size:10.5px;font-weight:700;color:var(--exam);letter-spacing:.01em;min-height:13px}
.chip[aria-current="true"]{border-color:var(--joint);box-shadow:inset 0 0 0 1px var(--joint)}
.chip.examday{border-left:4px solid var(--exam)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.daytitle{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:0 0 2px}
.daytitle h2{margin:0;font-size:25px;letter-spacing:-.02em}
.daytitle .wd{color:var(--muted);font-family:Archivo;font-weight:500;font-size:14px}
.examflag{font-family:Archivo;font-size:12px;font-weight:700;color:#fff;background:var(--exam);border-radius:5px;padding:3px 8px}
.target{border-left:3px solid var(--joint);padding:6px 0 6px 12px;margin:12px 0 4px;font-size:17px}
.target em{font-style:italic;color:var(--muted);font-family:Archivo;font-size:12px;font-weight:600;display:block;font-style:normal;margin-bottom:2px}

.block{margin-top:18px;padding-top:12px;border-top:1px solid var(--line2)}
.block>h3{margin:0 0 8px;font-size:13.5px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:7px}
.block>h3 .who{border-radius:4px;padding:1px 7px;color:#fff;font-size:11px;font-weight:700}
.w-b{background:var(--joint)} .w-a{background:var(--akash)} .w-v{background:var(--vanshika)}
.b-akash{border-left:3px solid var(--akash);padding-left:12px;border-top:none;margin-top:14px}
.b-vanshika{border-left:3px solid var(--vanshika);padding-left:12px;border-top:none;margin-top:14px}
.b-both{border-left:3px solid var(--joint);padding-left:12px;border-top:none;margin-top:14px}

ul.tasks{list-style:none;margin:0;padding:0}
ul.tasks li{display:flex;gap:9px;align-items:flex-start;padding:3px 0}
input[type=checkbox]{
  appearance:none;-webkit-appearance:none;flex:0 0 auto;
  width:17px;height:17px;margin:4px 0 0;border:1.5px solid var(--muted);border-radius:4px;
  background:transparent;cursor:pointer;position:relative}
input[type=checkbox]:hover{border-color:var(--ink)}
input[type=checkbox]:checked{background:var(--done);border-color:var(--done)}
input[type=checkbox]:checked::after{
  content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}
input[type=checkbox]:focus-visible{outline:2px solid var(--joint);outline-offset:2px}
label.tk{cursor:pointer;flex:1;min-width:0}
input:checked+label.tk{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
label.tk .note{display:block;font-family:Archivo;font-size:12px;color:var(--muted);text-decoration:none}

.fill{width:100%;font-family:"Source Serif 4",serif;font-size:15px;color:var(--ink);
  background:transparent;border:none;border-bottom:1px dashed var(--line);padding:5px 2px}
.fill:focus{outline:none;border-bottom:1px solid var(--joint)}
.must{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-top:16px}
.must h3{margin:0 0 6px;font-size:13px}

details.conc{border:1px solid var(--line);border-radius:9px;margin:8px 0;background:var(--panel)}
details.conc>summary{
  list-style:none;cursor:pointer;padding:10px 13px;display:flex;gap:9px;align-items:center;
  font-family:Archivo;font-weight:600;font-size:15px}
details.conc>summary::-webkit-details-marker{display:none}
details.conc>summary .co{font-family:"Source Serif 4",serif;font-weight:400;color:var(--muted);font-size:13.5px}
details.conc>summary .pct{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
details.conc[open]>summary{border-bottom:1px solid var(--line2)}
.conc-body{padding:10px 13px 13px}

.lede{max-width:66ch;color:var(--muted);font-size:15px;margin:2px 0 14px}
h2.sec{font-size:22px;letter-spacing:-.02em;margin:26px 0 2px}
h3.sub{font-size:14px;margin:18px 0 6px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.two{grid-template-columns:1fr}}
.trk{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;padding:6px 0;font-family:Archivo;font-size:13px}
.trk .n{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
@media(max-width:520px){.trk{grid-template-columns:110px 1fr 44px;font-size:12px}}
.hide{display:none}
.sync{font-family:Archivo;font-size:11.5px;color:var(--muted)}

.editing [data-editable="true"]{
  outline:1px dashed var(--joint);
  outline-offset:3px;
  cursor:text;
}
.editing [data-editable="true"]:focus{
  outline:2px solid var(--joint);
  outline-offset:3px;
}
.editing input[type="checkbox"]{
  cursor:pointer;
}
.editing .fill{
  background:var(--panel2);
}

@media print{
  header.top,nav.tabs,.rail,.headmeta{display:none}
  .card{break-inside:avoid;border-color:#bbb}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 class="brand">End-Term &amp; Placement War Room <span>· Akash &amp; Vanshika</span></h1>
    <div class="headmeta">
      <span class="sync" id="sync">connecting…</span>
      <button class="mini" id="editBtn">Edit</button>
      <button class="mini" id="themeBtn">Dark</button>
      <button class="mini" onclick="window.print()">Print</button>
    </div>
  </div>
  <div class="topbar">
    <div class="lab"><span id="ovLabel">Everything ticked so far</span><span id="ovPct">0%</span></div>
    <div class="bar"><i id="ovBar"></i></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<div class="wrap">
  <div id="railWrap"><div class="rail" id="rail"></div></div>
  <main id="view"></main>
</div>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
/* ============================ CONTENT ============================ */

// task string syntax:  "cat|text"  or  "cat|text||note"   (cat optional, defaults per section)
const DAYS = [

 cv:["cv|Akash: operations or campaign project defence sheet. Vanshika: ECOIL and the ratio analysis work"],
 rev:["15-minute blurt page — write everything you remember from today's SCM and IAPM topics, then check what you missed"]},

 target:"Close out MACR's syllabus and finish the hard SCM and IAPM topics, so tomorrow can be Strategic Management and nothing else.",

/* ============================ RENDER HELPERS ============================ */
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function parse(raw,defCat){
  let cat=defCat,text=raw,note="";
  const bar=raw.indexOf("|");
  if(bar>0 && bar<24 && !raw.slice(0,bar).includes(" ")){cat=raw.slice(0,bar);text=raw.slice(bar+1);}
  const nn=text.indexOf("||"); if(nn>-1){note=text.slice(nn+2);text=text.slice(0,nn);}
  return{cat,text,note};
}
function task(id,raw,defCat,owner){
  const {cat,text,note}=parse(raw,defCat);
  return `<li><input type="checkbox" id="${id}" data-cat="${cat}" data-own="${owner}"><label class="tk" for="${id}">${esc(text)}${note?`<span class="note">${esc(note)}</span>`:""}</label></li>`;
}
function list(prefix,arr,defCat,owner){
  if(!arr||!arr.length) return "";
  return `<ul class="tasks">${arr.map((t,i)=>task(prefix+i,t,defCat,owner)).join("")}</ul>`;
}
function fill(id,ph){return `<input class="fill" data-text="${id}" placeholder="${ph||""}">`;}

function makeEditable(root){
  if(!root) return;
  const skip = new Set(["SCRIPT","STYLE","INPUT","BUTTON","SUMMARY"]);
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
    acceptNode(node){
      const p=node.parentElement;
      if(!p || skip.has(p.tagName)) return NodeFilter.FILTER_REJECT;
      if(!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      if(p.closest("input,button,script,style,summary")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes=[];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    const p=node.parentElement;
    if(p.dataset.editable==="true") return;
    p.dataset.editable="true";
    p.contentEditable="false";
    p.addEventListener("click", e=>{
      if(!document.body.classList.contains("editing")) return;
      if(e.target.closest("input,button")) return;
      p.contentEditable="true";
      p.focus();
      e.stopPropagation();
    });
    p.addEventListener("blur",()=>{
      if(p.contentEditable==="true"){
        p.contentEditable="false";
        const key="editable:"+getEditableKey(p);
        state.texts[key]=p.innerHTML;
        setSync("saving…");
        scheduleSave();
      }
    });
    p.addEventListener("keydown",e=>{
      if(e.key==="Escape"){
        p.blur();
      }
    });
  });
}


function getEditableKey(el){
  const root=document.getElementById("view");
  if(!root || !el) return "";
  const parts=[];
  let cur=el;
  while(cur && cur!==root){
    let n=0, sib=cur;
    while((sib=sib.previousElementSibling)) n++;
    parts.unshift(cur.tagName.toLowerCase()+":"+n);
    cur=cur.parentElement;
  }
  return parts.join("/");
}

function restoreEditableText(root){
  if(!root) return;
  root.querySelectorAll('[data-editable="true"]').forEach(el=>{
    const key="editable:"+getEditableKey(el);
    if(state.texts[key]!==undefined) el.innerHTML=state.texts[key];
  });
}

function applyEditableMode(){
  document.body.classList.toggle("editing", editingMode);
  const b=document.getElementById("editBtn");
  if(b) b.textContent=editingMode?"Done":"Edit";
  const v=document.getElementById("view");
  makeEditable(v);
  restoreEditableText(v);
}

      <span class="bar" style="margin-top:6px"><i data-daybar="${i}"></i></span>
    </button>`).join("");
}
document.getElementById("rail").addEventListener("click",e=>{
  const b=e.target.closest("button[data-day]"); if(!b) return;
  day=+b.dataset.day; render();
});

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  renderRail();
  const v=document.getElementById("view");
  v.innerHTML = tab==="days"?dayHTML(day)
    : tab==="marketing"?marketingHTML()
    : tab==="excel"?excelHTML()
    : tab==="finance"?financeHTML()
    : tab==="ops"?opsHTML()
    : tab==="pbi"?pbiHTML()
    : tab==="cv"?cvHTML()
    : trackerHTML();
  makeEditable(v);
  applyState();
  restoreEditableText(v);
}

function applyState(){
  document.querySelectorAll('input[type=checkbox]').forEach(c=>{c.checked=!!state.checks[c.id];});
  document.querySelectorAll('input[data-text]').forEach(t=>{t.value=state.texts[t.dataset.text]||"";});
  restoreEditableText(document.getElementById("view"));
  recompute();
}

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.type==="checkbox"){
    if(t.checked) state.checks[t.id]=1; else delete state.checks[t.id];
    const grp=t.closest("details.conc");
    if(grp && t.id.endsWith("main")){
      grp.querySelectorAll('.conc-body input[type=checkbox]').forEach(c=>{
        c.checked=t.checked; if(t.checked) state.checks[c.id]=1; else delete state.checks[c.id];
      });
    }
    scheduleSave(); recompute();
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset && t.dataset.text!==undefined){
    if(t.value) state.texts[t.dataset.text]=t.value; else delete state.texts[t.dataset.text];
    scheduleSave();
  }
});

// full catalogue of every checkbox id -> {cat,own} so trackers work across tabs
const CATALOG=(function(){
  const out=[];
  const add=(id,cat,own)=>out.push({id,cat,own});
  DAYS.forEach((D,i)=>{
    const p="d"+i+"-";
    const secs=[["b-",D.both,"exam","b"],["a-",D.akash,"exam","a"],["v-",D.vanshika,"exam","v"],
                ["p-",D.place,"interview","b"],["u-",D.up,"excel","b"],["c-",D.cv,"cv","b"],["r-",D.rev,"exam","b"]];
    secs.forEach(s=>(s[1]||[]).forEach((raw,j)=>{const pr=parse(raw,s[2]); add(p+s[0]+j,pr.cat,s[3]);}));
  });
  CONCEPTS.forEach((c,i)=>{add("mk"+i+"-main","marketing","b"); TEN.forEach((t,j)=>add("mk"+i+"-"+j,"marketing","b"));});
  CASES.forEach((c,i)=>{add("cs"+i+"-main","cases","b"); CASE_STEPS.forEach((t,j)=>add("cs"+i+"-"+j,"cases","b"));});
  EXCEL.forEach((e,i)=>add("xl"+i,"excel","b"));
  FINANCE.forEach((f,i)=>add("fn"+i,"finance","v"));
  let n=0; RATIOS.forEach(g=>g[1].forEach(()=>{const p="rt"+(n++)+"-"; add(p+"main","ratios","v"); RSTEPS.forEach((s,j)=>add(p+j,"ratios","v"));}));
  OPS.forEach((o,i)=>add("op"+i,"ops","a"));
  PBI.forEach((p,i)=>add("pb"+i,"pbi","b"));
  for(let i=0;i<6;i++){add("pja"+i,"pbi","a"); add("pjv"+i,"pbi","v");}
  ["a","v"].forEach(w=>{for(let s=0;s<4;s++){const p="cv"+w+s+"-"; add(p+"main","cv",w); CV14.forEach((t,j)=>add(p+j,"cv",w));}});
  INTERVIEW.forEach((q,i)=>add("iv"+i,"interview",q[1]));
  for(let i=0;i<6;i++) add("jm"+i,"interview","b");
  return out;
})();

function pct(filter){
  const s=CATALOG.filter(filter);
  if(!s.length) return 0;
  const done=s.filter(x=>state.checks[x.id]).length;
  return Math.round(done*100/s.length);
}
function recompute(){
  const all=pct(()=>true);
  document.getElementById("ovPct").textContent=all+"%";
  document.getElementById("ovBar").style.width=all+"%";
  document.querySelectorAll("[data-daybar]").forEach(el=>{
    const i=+el.dataset.daybar, p="d"+i+"-";
    el.style.width=pct(x=>x.id.startsWith(p))+"%";
  });
  document.querySelectorAll("[data-pct]").forEach(el=>{
    const g=el.dataset.pct;
    const v=pct(x=>x.id.startsWith(g)&&!x.id.endsWith("main"));
    el.textContent=v+"%";
  });
  document.querySelectorAll("[data-trk]").forEach(el=>{
    const [own,cats]=el.dataset.trk.split(":");
    const cl=cats.split("+");
    const v=pct(x=>(own==="all"||x.own===own||x.own==="b")&&(cats==="*"||cl.includes(x.cat)));
    el.textContent=v+"%";
    const bar=document.querySelector(`[data-trkbar="${el.dataset.trk}"]`);
    if(bar) bar.style.width=v+"%";
  });
}


const eb=document.getElementById("editBtn");
eb.addEventListener("click",()=>{
  editingMode=!editingMode;
  applyEditableMode();
  if(!editingMode) setSync("text saved locally");
});

// theme
const tb=document.getElementById("themeBtn");
const prefDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
let theme=localStorage.getItem("warroom.theme")||(prefDark?"dark":"light");
function applyTheme(){document.documentElement.setAttribute("data-theme",theme); tb.textContent=theme==="dark"?"Light":"Dark";}
tb.addEventListener("click",()=>{theme=theme==="dark"?"light":"dark"; try{localStorage.setItem("warroom.theme",theme);}catch(e){} applyTheme();});
applyTheme();

// open today's card if the date matches, else day 1
(function(){
  const now=new Date(), md=now.getDate()+" "+now.toLocaleString("en",{month:"short"});
  const i=DAYS.findIndex(D=>D.d===md);
  if(i>-1) day=i;
})();
render();
</script>
